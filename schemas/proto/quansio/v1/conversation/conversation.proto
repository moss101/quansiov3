// Quansio conversation model (DOMAIN.md §3): threads, messages, questions.
syntax = "proto3";

package quansio.v1.conversation;

import "quansio/v1/trust/trust.proto";

message Participant {
  string schema_version = 100;
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_USER = 1;
    KIND_TEAMMATE = 2;
    KIND_WORKER = 3;
  }
  Kind kind = 1;
  string id = 2;
  enum Role {
    ROLE_UNSPECIFIED = 0;
    ROLE_OWNER = 1;
    ROLE_MEMBER = 2;
  }
  Role role = 3;
  string joined_at = 4;
  string left_at = 5;
}

message Thread {
  string schema_version = 100;
  string id = 1;
  string workspace_id = 2;
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_DIRECT = 1;
    KIND_GROUP = 2;
    KIND_OBJECTIVE = 3;
  }
  Kind kind = 3;
  string title = 4;
  repeated Participant participants = 5;
  string objective_id = 6;
  string archived_at = 7;
  string last_activity_at = 8;
}

message ContentBlock {
  string schema_version = 100;
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_TEXT = 1;
    KIND_CODE = 2;
    KIND_ARTIFACT_REF = 3;
    KIND_EVIDENCE_REF = 4;
    KIND_QUESTION = 5;
    KIND_TOOL_CARD_REF = 6;
    KIND_SYSTEM_NOTICE = 7;
  }
  Kind kind = 1;
  string text = 2;
  string ref = 3;
  string language = 4;
}

message Reaction {
  string schema_version = 100;
  string emoji = 1;
  string user_id = 2;
}

message Message {
  string schema_version = 100;
  string id = 1;
  string thread_id = 2;
  int64 seq = 3;  // thread-monotonic
  string author_kind = 4;  // user | agent | system
  string author_id = 5;
  string run_id = 6;
  string turn_id = 7;
  repeated ContentBlock content_blocks = 8;
  repeated string attachments = 9;  // artifact ids
  string reply_to = 10;
  repeated Reaction reactions = 11;
  repeated string mentions = 12;
  trust.TrustLevel trust_level = 13;
  string created_at = 14;
  string edited_at = 15;
  string deleted_at = 16;
}

// Agent -> human question (DOMAIN.md §3.4). An agent thread may not answer itself.
enum QuestionStatus {
  QUESTION_STATUS_UNSPECIFIED = 0;
  QUESTION_STATUS_OPEN = 1;
  QUESTION_STATUS_ANSWERED = 2;
  QUESTION_STATUS_EXPIRED = 3;
  QUESTION_STATUS_CANCELLED = 4;
}

message Question {
  string schema_version = 100;
  string id = 1;
  string run_id = 2;
  string step_id = 3;
  string thread_id = 4;
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_FREE_TEXT = 1;
    KIND_SINGLE_CHOICE = 2;
    KIND_MULTI_CHOICE = 3;
    KIND_CONFIRM = 4;
  }
  Kind kind = 5;
  string prompt = 6;
  repeated string options = 7;
  bool required = 8;
  string expires_at = 9;
  QuestionStatus status = 10;
  Answer answer = 11;
}

message Answer {
  string schema_version = 100;
  string user_id = 1;
  string value = 2;
  string answered_at = 3;
}
