// Quansio error taxonomy (DOMAIN.md §15) and the envelope every command returns.
syntax = "proto3";

package quansio.v1.core;

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  // Auth (401/403)
  ERROR_CODE_AUTH_REQUIRED = 1;
  ERROR_CODE_AUTH_INVALID_TOKEN = 2;
  ERROR_CODE_AUTH_EXPIRED = 3;
  ERROR_CODE_SCOPE_FORBIDDEN = 4;
  ERROR_CODE_TENANT_MISMATCH = 5;
  // Validation (400)
  ERROR_CODE_VALIDATION_SCHEMA = 6;
  ERROR_CODE_VALIDATION_UNKNOWN_FIELD = 7;
  ERROR_CODE_VALIDATION_BOUNDS = 8;
  // Conflict (409)
  ERROR_CODE_CONFLICT_REVISION = 9;
  ERROR_CODE_CONFLICT_IDEMPOTENCY_MISMATCH = 10;
  ERROR_CODE_CONFLICT_STATE = 11;
  // Authority (403)
  ERROR_CODE_CAPABILITY_DENIED = 12;
  ERROR_CODE_CAPABILITY_INPUTS_UNAVAILABLE = 13;
  ERROR_CODE_POLICY_DENIED = 14;
  ERROR_CODE_APPROVAL_REQUIRED = 15;
  ERROR_CODE_APPROVAL_INVALID = 16;
  ERROR_CODE_APPROVAL_EXPIRED = 17;
  ERROR_CODE_APPROVAL_SUPERSEDED = 18;
  // Runtime (409/422)
  ERROR_CODE_RUNTIME_ILLEGAL_TRANSITION = 19;
  ERROR_CODE_FENCED_STALE_GENERATION = 20;
  ERROR_CODE_LEASE_LOST = 21;
  ERROR_CODE_EFFECT_UNKNOWN_PENDING_RECONCILIATION = 22;
  ERROR_CODE_BUDGET_EXHAUSTED = 23;
  ERROR_CODE_EFFECTS_FROZEN = 24;
  // Execution (503/504)
  ERROR_CODE_TARGET_UNAVAILABLE = 25;
  ERROR_CODE_TARGET_PROVISION_FAILED = 26;
  ERROR_CODE_TOOL_TIMEOUT = 27;
  ERROR_CODE_TOOL_OUTPUT_TRUNCATED = 28;  // warning
  ERROR_CODE_EGRESS_DENIED = 29;
  // Model (502/503)
  ERROR_CODE_PROVIDER_UNAVAILABLE = 30;
  ERROR_CODE_PROVIDER_RATE_LIMITED = 31;
  ERROR_CODE_PROVIDER_REFUSAL = 32;
  ERROR_CODE_ROUTE_UNAVAILABLE = 33;
  ERROR_CODE_DLP_DENIED = 34;
  // Generic
  ERROR_CODE_NOT_FOUND = 35;
  ERROR_CODE_RATE_LIMITED = 36;
  ERROR_CODE_STREAM_BACKPRESSURE = 37;
  ERROR_CODE_INTERNAL = 38;
}

message ErrorDetail {
  string schema_version = 100;
  string key = 1;
  string value = 2;
}

message Error {
  string schema_version = 100;
  ErrorCode code = 1;
  string message = 2;
  string correlation_id = 3;
  bool retryable = 4;
  repeated ErrorDetail details = 5;
}

// Every command returns this envelope (DOMAIN.md §14).
message CommandResult {
  string schema_version = 100;
  string command_id = 1;
  string accepted_at = 2;
  // Canonical JSON of the command-specific result; the command's OpenAPI schema
  // describes the concrete shape.
  string result_json = 3;
  Error error = 4;
}
