components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: ES256 JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: q_refresh
  schemas:
    Error:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      - correlation_id
      - retryable
      properties:
        code:
          type: string
          enum:
          - AUTH_REQUIRED
          - AUTH_INVALID_TOKEN
          - AUTH_EXPIRED
          - SCOPE_FORBIDDEN
          - TENANT_MISMATCH
          - VALIDATION_SCHEMA
          - VALIDATION_UNKNOWN_FIELD
          - VALIDATION_BOUNDS
          - CONFLICT_REVISION
          - CONFLICT_IDEMPOTENCY_MISMATCH
          - CONFLICT_STATE
          - CAPABILITY_DENIED
          - CAPABILITY_INPUTS_UNAVAILABLE
          - POLICY_DENIED
          - APPROVAL_REQUIRED
          - APPROVAL_INVALID
          - APPROVAL_EXPIRED
          - APPROVAL_SUPERSEDED
          - RUNTIME_ILLEGAL_TRANSITION
          - FENCED_STALE_GENERATION
          - LEASE_LOST
          - EFFECT_UNKNOWN_PENDING_RECONCILIATION
          - BUDGET_EXHAUSTED
          - EFFECTS_FROZEN
          - TARGET_UNAVAILABLE
          - TARGET_PROVISION_FAILED
          - TOOL_TIMEOUT
          - TOOL_OUTPUT_TRUNCATED
          - EGRESS_DENIED
          - PROVIDER_UNAVAILABLE
          - PROVIDER_RATE_LIMITED
          - PROVIDER_REFUSAL
          - ROUTE_UNAVAILABLE
          - DLP_DENIED
          - NOT_FOUND
          - RATE_LIMITED
          - STREAM_BACKPRESSURE
          - INTERNAL
          description: DOMAIN.md §15 error taxonomy.
        message:
          type: string
        correlation_id:
          type: string
        retryable:
          type: boolean
        details:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              key:
                type: string
              value:
                type: string
    CommandEnvelope:
      type: object
      additionalProperties: false
      required:
      - command_id
      properties:
        command_id:
          type: string
          description: Client-generated ULID; idempotent per tenant (DOMAIN.md §1.2).
        params:
          type: object
    CreateWorkspaceParams:
      type: object
      additionalProperties: true
      description: 'Identity command CreateWorkspace. The concrete parameter schema is owned by the implementing task and
        must be added additively; until then this schema is deliberately open and marked x-quansio-params-defined: false.'
      x-quansio-params-defined: false
    UpdateWorkspaceParams:
      type: object
