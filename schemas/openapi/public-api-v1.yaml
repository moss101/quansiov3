        aggregate_type:
          type: string
          minLength: 1
        aggregate_id:
          type: string
          minLength: 1
        aggregate_version:
          type: integer
          minimum: 1
        type:
          type: string
          pattern: ^(tenant|workspace|member|thread|work|agent|run|turn|step|model|tool|effect|approval|question|target|lease|browser|terminal|checkpoint|artifact|evidence|knowledge|memory|skill|pack|routine|notification|connector|webhook|policy|audit|usage|capability|compaction|ops)\.[a-z_]+$
        schema_version:
          type: string
          minLength: 1
        occurred_at:
          type: string
          format: date-time
        command_id:
          type: string
          pattern: ^cmd_[0-9A-HJKMNP-TV-Z]{26}$
        correlation_id:
          type: string
          minLength: 1
        causation_id:
          type: string
        actor:
          type: object
          additionalProperties: false
          required:
          - kind
          - id
          properties:
            kind:
              enum:
              - user
              - agent
              - system
              - service
            id:
              type: string
              minLength: 1
        generation:
          type: integer
          minimum: 0
        payload:
          type: object
    StreamSubscribe:
      type: object
      required:
      - subscribe
      properties:
        subscribe:
          type: array
          items:
            type: object
            required:
            - channel
            properties:
              channel:
                type: string
        cursor:
          type: string
        consumer:
          type: string
    StreamEventFrame:
      type: object
      required:
      - kind
      - cursor
      - event
      properties:
        kind:
          const: event
        cursor:
          type: string
          description: Opaque; resume after this event.
        event:
          $ref: '#/components/schemas/RuntimeEvent'
    StreamLiveFrame:
      type: object
      required:
      - kind
      - channel
      - frame
      properties:
        kind:
          const: live
        channel:
          type: string
        frame:
          type: object
          description: Transient (model.delta, terminal.bytes, browser.frame, progress); never persisted.
    Session:
      type: object
      additionalProperties: false
      required:
      - session_id
      - user_id
      - tenant_id
      - access_token
      - access_expires_at
      - refresh_token
      - refresh_expires_at
      properties:
        session_id:
          type: string
        user_id:
          type: string
        tenant_id:
          type: string
        access_token:
          type: string
          description: ES256 JWT, at most 15 minutes (DOMAIN.md §2).
        access_expires_at:
          type: string
          format: date-time
        refresh_token:
          type: string
          description: Opaque, rotating; stored in the OS keychain on desktop.
        refresh_expires_at:
          type: string
          format: date-time
        workspace_id:
          type: string
        onboarded:
          type: boolean
