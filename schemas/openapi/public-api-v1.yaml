  /v1/stream:
    get:
      operationId: Stream
      summary: The event stream over WebSocket (DOMAIN.md §9.3).
      description: Upgrade to a WebSocket, then send one StreamSubscribe message. The server sends StreamEventFrame (durable,
        replayable, with a cursor) and StreamLiveFrame (transient) messages; reconnect with the last cursor to replay what
        was missed. A slow consumer is disconnected with STREAM_BACKPRESSURE. A protected thread's events reach only its participants.
      tags:
      - Stream
      parameters:
      - name: x-quansio-consumer
        in: header
        schema:
          type: string
      responses:
        '101':
          description: Switching Protocols to WebSocket.
        default: &id001
          description: Typed error (DOMAIN.md §15).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-quansio-transport: websocket
      x-quansio-client-message:
        $ref: '#/components/schemas/StreamSubscribe'
      x-quansio-server-messages:
      - $ref: '#/components/schemas/StreamEventFrame'
      - $ref: '#/components/schemas/StreamLiveFrame'
  /v1/stream/events:
    get:
      operationId: StreamEvents
      summary: The event stream as Server-Sent Events, for read-only consumers (DOMAIN.md §9.3).
      description: 'Each durable event is one SSE message: `event: event`, `id:` the stream cursor, `data:` a StreamEventFrame.
        Reconnecting with `Last-Event-ID` (or `cursor`) resumes after it. The same channels and the same protected-thread
        gate as the WebSocket.'
      tags:
      - Stream
      parameters:
      - name: channel
        in: query
        required: true
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
            pattern: ^(workspace|thread|run|target):[a-z]+_[0-9A-HJKMNP-TV-Z]{26}$
      - name: cursor
        in: query
        schema:
          type: string
      - name: consumer
        in: query
        schema:
          type: string
      - name: Last-Event-ID
        in: header
        schema:
          type: string
      responses:
        '200':
          description: An event stream; each `data:` is a StreamEventFrame.
          content:
            text/event-stream:
              schema:
                type: string
              x-quansio-sse-data:
                $ref: '#/components/schemas/StreamEventFrame'
        default: *id001
  /v1/hooks/{endpoint_id}:
    post:
      operationId: ReceiveRoutineHook
      summary: Deliver an event to a routine's inbound hook (DOMAIN.md §13.8 A).
      description: 'Authenticated by `quansio-signature: t=<unix seconds>,v1=<hex HMAC-SHA256(secret, "<t>.<body>")>` (the
        secret is shown once when the routine is created) with a timestamp within the tolerance window. The body is one JSON
        object of at most 64 KiB. A delivery whose `quansio-delivery-id` or signature was seen before is answered `duplicate`
        and fires nothing. The payload reaches the run only as untrusted data.'
      tags:
      - Hooks
      security: []
      parameters:
      - name: endpoint_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^hk_[A-Za-z0-9_-]{43}$
      - name: quansio-signature
        in: header
        required: true
        schema:
          type: string
      - name: quansio-delivery-id
        in: header
        schema:
          type: string
          pattern: ^[A-Za-z0-9._:-]{1,128}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: 'Authenticated, and `duplicate` or `filtered`: nothing fired.'
          content:
            application/json:
              schema: &id002
                type: object
                required:
                - status
                properties:
                  status:
                    type: string
                    enum:
                    - accepted
                    - filtered
                    - duplicate
                  fire_id:
                    type: string
                    description: The claimed fire, when status is `accepted`.
        '202':
          description: 'Authenticated and accepted: one fire was claimed.'
          content:
            application/json:
              schema: *id002
        default:
          description: Typed error (DOMAIN.md §15).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
