webhooks:
  runtimeEvent:
    post:
      operationId: WebhookRuntimeEvent
      summary: One RuntimeEvent, redacted, signed, delivered at least once (DOMAIN.md §13.5).
      parameters:
      - name: quansio-event-id
        in: header
        required: true
        schema:
          type: string
        description: The stable event id; deliveries are at-least-once, so dedupe on it.
      - name: quansio-event-type
        in: header
        required: true
        schema:
          type: string
        description: The event type.
      - name: quansio-delivery-id
        in: header
        required: true
        schema:
          type: string
        description: The delivery (`whd_…`); the same across retries of one event.
      - name: quansio-signature
        in: header
        required: true
        schema:
          type: string
        description: '`t=<unix seconds>,v1=<hex HMAC-SHA256(secret, "<t>.<body>")>`; reject a timestamp more than 300 s from
          your clock.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeEvent'
      responses:
        2XX:
          description: Acknowledged. Anything else, or no answer within 10 s, is retried with backoff.
