openapi: 3.1.0
info:
  title: Quansio Public API
  version: v1
  description: Generated from DOMAIN.md by scripts/ci/gen_contracts.py. Commands are POST /v1/commands/<Name> with idempotent
    command_id; reads are GET projections. Additive changes only within v1 (DOMAIN.md §17). The WebSocket stream (GET /v1/stream)
    and its Server-Sent Events form (GET /v1/stream/events) are described below (DOMAIN.md §9.3); outbound webhooks are under
    `webhooks` (§13.5).
servers:
- url: https://{host}/v1
  variables:
    host:
      default: localhost:8443
security:
- bearerAuth: []
tags:
- name: Identity
- name: Teammates
- name: Conversation
- name: Work
- name: Trust
- name: Execution
- name: Browser/computer
- name: Artifacts
- name: Knowledge & memory
- name: Skills & packs
- name: Recording
- name: Routines
- name: Connectors
- name: Notifications
- name: Admin/ops
- name: Read projections
- name: Stream
paths:
  /v1/commands/CreateWorkspace:
    post:
      operationId: CreateWorkspace
      summary: 'Identity: CreateWorkspace'
      tags:
      - Identity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommandEnvelope'
      responses:
        '200':
          description: Accepted; result or typed error (DOMAIN.md §14).
          content:
            application/json:
              schema:
                type: object
                required:
                - command_id
                - accepted_at
                properties:
                  command_id:
                    type: string
                  accepted_at:
                    type: string
                    format: date-time
                  result:
                    type:
                    - object
                    - 'null'
                  error:
                    oneOf:
                    - $ref: '#/components/schemas/Error'
                    - type: 'null'
        default:
          description: Typed error (DOMAIN.md §15).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
