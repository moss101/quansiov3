[project]
name = "quansio-intelligence"
version = "0.1.0"
description = "Quansio V8.1 intelligence plane: model gateway, context, knowledge, memory, embeddings, skills, evaluation, capability compiler."
readme = "intelligence/README.md"
requires-python = ">=3.12"
license = { text = "LicenseRef-Quansio-Proprietary" }
dependencies = [
    # config/*.yaml parsing (model catalog, flags, policies) in the intelligence plane.
    "pyyaml>=6.0.2",
    # Generated contract bindings and the Rust<->Python gRPC boundary (GOV-004, INT-001).
    "protobuf>=5.29",
    "grpcio>=1.68",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-protobuf>=5.27",
    # Contract generation and validation (GOV-004).
    "grpcio-tools>=1.68",
    "jsonschema>=4.23",
    # Dev-stack integration tests: real Postgres/NATS/MinIO assertions (GOV-007).
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `intelligence` is the hand-written plane; `quansio` is the protoc-generated contract
# package, which must import as `quansio.v1.*` (protoc emits absolute proto-package
# imports, so the generated tree is placed at the distribution root).
packages = ["intelligence", "quansio"]

[tool.hatch.build.targets.wheel.sources]
"intelligence/contracts/generated" = ""

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["intelligence/contracts/generated"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The servicer implements the generated gRPC contract, whose method names are fixed by
# quansio.v1.intelligence.IntelligenceGateway and cannot be lower-cased.
"intelligence/server/servicer.py" = ["N802"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_generics = true
no_implicit_reexport = true
mypy_path = "intelligence/contracts/generated"
# The generated tree is analysed once, under its canonical `quansio.v1.*` name.
exclude = '^intelligence/contracts/generated/'

[[tool.mypy.overrides]]
# protoc-generated protobuf/gRPC modules and grpcio are machine-written, unannotated.
module = ["quansio.*", "grpc", "grpc.*"]
ignore_errors = true
disallow_untyped_defs = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
# PyYAML ships no inline type information and the distribution does not pin types-PyYAML.
# Catalog data is cast at the boundary in `intelligence.model_gateway.catalog`.
module = ["yaml"]
ignore_missing_imports = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# protoc-generated bindings are not hand-written code; mypy strict does not apply.
module = "intelligence.contracts.generated.*"
ignore_errors = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: requires QUANSIO_TEST_* credentials for a real boundary"]
