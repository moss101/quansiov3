[project]
name = "quansio-intelligence"
version = "0.1.0"
description = "Quansio V8.1 intelligence plane: model gateway, context, knowledge, memory, embeddings, skills, evaluation, capability compiler."
readme = "intelligence/README.md"
requires-python = ">=3.12"
license = { text = "LicenseRef-Quansio-Proprietary" }
dependencies = [
    # config/*.yaml parsing (model catalog, flags, policies) in the intelligence plane.
    "pyyaml>=6.0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-protobuf>=5.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["intelligence"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_generics = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: requires QUANSIO_TEST_* credentials for a real boundary"]
