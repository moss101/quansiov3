[package]
name = "quansio-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "IDs, generation counters, idempotency keys and typed errors shared across the Quansio runtime."

[lints]
workspace = true

[dependencies]
base64 = "0.22"
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
quansio-contracts = { path = "../contracts" }
serde_json = "1"
