[package]
name = "quansio-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Tool contract, Tool Registry and dispatch descriptors shared by the runtime and qworkerd."

[lints]
workspace = true

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
quansio-capability = { path = "../capability" }
quansio-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"

[dev-dependencies]
quansio-contracts = { path = "../contracts" }
