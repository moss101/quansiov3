[package]
name = "quansio-qworkerd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Worker daemon: tool host, terminal, checkpoints and managed browser (CDP)."

[lints]
workspace = true

[dependencies]
quansio-core = { path = "../core" }
quansio-machine = { path = "../machine" }
quansio-tools = { path = "../tools" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
futures-util = { version = "0.3", default-features = false, features = ["sink", "alloc"] }
tokio-tungstenite = "0.26"
# The composition sandbox's interpreter (ADP-009, DOMAIN.md 7.5 "Composition sandbox"): QuickJS, embedded, with a memory limit, a
# stack limit and an interrupt handler. MIT (the QuickJS-ng engine it bundles is MIT too); no network, file or process access exists
# in it unless the host hands one over, and the host hands over none. Chosen over a WebAssembly or a V8 runtime for its size, its
# bounded-memory allocator and its interrupt hook; see evidence/ADP-009/RECONCILIATION.md for the dependency record.
rquickjs = { version = "0.13", default-features = false, features = ["std"] }
# The MCP client's streamable-HTTP transport (ADP-009). Already in the workspace for webhook delivery; TLS is rustls, as there.
# Redirects and system proxies are switched off per request and every request goes to addresses the egress gate vetted.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["macros", "rt", "sync", "process", "io-util", "time", "net", "fs"] }

[dev-dependencies]
quansio-capability = { path = "../capability" }
chrono = "0.4"
quansio-machine = { path = "../machine", features = ["test-support"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tempfile = "3"
base64 = "0.22"
