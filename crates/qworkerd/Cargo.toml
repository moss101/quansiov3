[package]
name = "quansio-qworkerd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Worker daemon: tool host, terminal, checkpoints and managed browser (CDP)."

[lints]
workspace = true

[dependencies]
quansio-core = { path = "../core" }
quansio-machine = { path = "../machine" }
async-trait = "0.1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
