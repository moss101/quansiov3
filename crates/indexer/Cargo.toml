[package]
name = "quansio-indexer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "quansio-indexer: exact, lexical and symbol indexes over authoritative sources."

[lints]
workspace = true

[dependencies]
quansio-core = { path = "../core" }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "json", "chrono"] }
tantivy = "0.26"
thiserror = "2"

[dev-dependencies]
quansio-server = { path = "../server" }
async-trait = "0.1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "json", "chrono"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
