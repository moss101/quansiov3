[package]
name = "quansio-graph"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "WorkGraph, AgentGraph and StateGraph stores plus GraphTransaction."

[lints]
workspace = true

[dependencies]
quansio-core = { path = "../core" }
quansio-events = { path = "../events" }
quansio-server = { path = "../server" }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "json"] }
thiserror = "2"

[dev-dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
quansio-capability = { path = "../capability" }
quansio-events = { path = "../events" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
