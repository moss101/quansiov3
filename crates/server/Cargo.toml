[package]
name = "quansio-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "quansio-server: authoritative API, control, runtime, policy, effects, scheduler and artifact composition."

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "macros", "json", "chrono", "uuid"] }
thiserror = "2"

[dev-dependencies]
quansio-core = { path = "../core" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
