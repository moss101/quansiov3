[package]
name = "quansio-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "quansio-server: authoritative API, control, runtime, policy, effects, scheduler and artifact composition."

[lints]
workspace = true

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
hmac = "0.12"
quansio-core = { path = "../core" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "macros", "json", "chrono", "uuid"] }
thiserror = "2"

[dev-dependencies]
async-trait = "0.1"
quansio-core = { path = "../core" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
