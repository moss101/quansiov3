[package]
name = "quansio-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "quansio-server: authoritative API, control, runtime, policy, effects, scheduler and artifact composition."

[lints]
workspace = true

[dependencies]
async-trait = "0.1"
axum = "0.7"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
hmac = "0.12"
quansio-capability = { path = "../capability" }
quansio-core = { path = "../core" }
quansio-events = { path = "../events" }
quansio-tools = { path = "../tools" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "macros", "json", "chrono", "uuid"] }
thiserror = "2"
tokio = { version = "1", features = ["time", "sync", "net", "rt-multi-thread", "macros"] }

[dev-dependencies]
async-trait = "0.1"
tower = { version = "0.5", features = ["util"] }
quansio-core = { path = "../core" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
