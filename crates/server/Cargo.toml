[package]
name = "quansio-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "quansio-server: authoritative API, control, runtime, policy, effects, scheduler and artifact composition."

[lints]
workspace = true

[dependencies]
async-trait = "0.1"
axum = { version = "0.7", features = ["ws"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
hmac = "0.12"
hyper-util = { version = "0.1", features = ["tokio"] }
prost = "0.13"
quansio-capability = { path = "../capability" }
quansio-contracts = { path = "../contracts" }
quansio-core = { path = "../core" }
quansio-events = { path = "../events" }
quansio-graph = { path = "../graph" }
quansio-indexer = { path = "../indexer" }
quansio-machine = { path = "../machine" }
quansio-tools = { path = "../tools" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "json"] }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "macros", "json", "chrono", "uuid"] }
thiserror = "2"
tokio = { version = "1", features = ["time", "sync", "net", "rt-multi-thread", "macros"] }
tonic = "0.12"
tower = { version = "0.5", features = ["util"] }
futures-util = "0.3"

[dev-dependencies]
async-trait = "0.1"
futures-util = "0.3"
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = "0.24"
quansio-core = { path = "../core" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tempfile = "3"
