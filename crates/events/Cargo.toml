[package]
name = "quansio-events"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "RuntimeEvent store, transactional outbox, rebuildable projections and resumable client streaming."

[lints]
workspace = true

[dependencies]
quansio-core = { path = "../core" }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "json", "chrono", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync"] }

[dev-dependencies]
# Test-only: the integration tests apply the canonical migrations through the server
# crate's schema runner so there is exactly one migration path in the repository.
quansio-server = { path = "../server" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
