[package]
name = "quansio-machine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Machine control, worker gateway, secret broker and egress broker."

[lints]
workspace = true

[dependencies]
quansio-core = { path = "../core" }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "json", "chrono", "migrate", "macros"] }
serde_json = "1"
serde_yaml = "0.9"
base64 = "0.22"
chacha20poly1305 = "0.10"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync"] }

[features]
# Lets another crate's *tests* build a DecisionReceipt without a database, so the worker half of a
# user decision can be driven against a real browser. A receipt is otherwise minted only by
# BrowserSessionStore for a user actor; the control-plane half is tested against real PostgreSQL in
# this crate's own suite. No production target enables this feature.
test-support = []

[dev-dependencies]
async-trait = "0.1"
# The Tool Registry's receipt schema and coherence rules must agree with the runtime's (ADP-002).
quansio-tools = { path = "../tools" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
