[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/contracts",
    "crates/events",
    "crates/graph",
    "crates/capability",
    "crates/tools",
    "crates/indexer",
    "crates/machine",
    "crates/qworkerd",
    "crates/server",
    "crates/cli",
    "native/windows",
]

# Contract codegen is repository tooling, not a product package: it lives under
# scripts/dev and is deliberately outside the product workspace (GOV-004).
exclude = ["scripts/dev/contract-gen"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "LicenseRef-Quansio-Proprietary"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
