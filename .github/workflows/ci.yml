# Quansio V8.1 baseline CI (GOV-005).
#
# The pipeline definition lives in `scripts/ci/ci_summary.py`; this workflow only
# provisions the toolchains and runs `scripts/ci/ci.sh`, so a clean checkout runs
# exactly what the commit-bound summary records.
name: ci

on:
  push:
    branches: [main, "task/**", "fix/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      # Schema/persistence tests exercise a real database (CORE-001); the image ships pgvector.
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: quansio
          POSTGRES_PASSWORD: quansio-ci-only
          POSTGRES_DB: quansio
        ports:
          - 55440:5432
        options: >-
          --health-cmd "pg_isready -U quansio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --shm-size 1g
          -c max_locks_per_transaction=1024
          -c max_connections=100
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # dossier consistency needs full history for commit reachability

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install workspace dependencies
        run: |
          pnpm install --frozen-lockfile
          (cd python && uv sync --python 3.12 --frozen)

      - name: Run the baseline pipeline
        env:
          QUANSIO_TEST_POSTGRES_URL: postgres://quansio:quansio-ci-only@127.0.0.1:55440/quansio
        run: bash scripts/ci/ci.sh

      - name: Upload the machine-readable summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-summary
          path: artifacts/ci/summary-*.json
          if-no-files-found: warn
