# Quansio V8.1 baseline CI (GOV-005).
#
# The pipeline definition lives in `scripts/ci/ci_summary.py`; this workflow only
# provisions the toolchains and runs `scripts/ci/ci.sh`, so a clean checkout runs
# exactly what the commit-bound summary records.
name: ci

on:
  push:
    branches: [main, "task/**", "fix/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # dossier consistency needs full history for commit reachability

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install workspace dependencies
        run: |
          pnpm install --frozen-lockfile
          (cd python && uv sync --python 3.12 --frozen)

      # The same deterministic stack GOV-007 built for local development
      # (infra/compose/compose.yaml via config/dev.yaml), not a second, hand-
      # maintained container definition: a `services:` block here previously
      # duplicated postgres's settings and got the -c max_locks_per_transaction/
      # max_connections flags wrong (`options:` is docker-create flags only, not
      # the container's command -- see this commit's evidence for the failure
      # mode). scripts/dev/up writes a gitignored .env from
      # config/dev.yaml + dev-only defaults; ci_summary.py's dev_database_url()
      # already reads it automatically, so no explicit QUANSIO_TEST_POSTGRES_URL
      # is needed here. A longer health timeout than the local default accounts
      # for cold image pulls on a fresh runner.
      - name: Start the deterministic dev stack
        env:
          QUANSIO_DEV_HEALTH_TIMEOUT: "180"
        run: bash scripts/dev/up

      - name: Run the baseline pipeline
        run: bash scripts/ci/ci.sh

      - name: Upload the machine-readable summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-summary
          path: artifacts/ci/summary-*.json
          if-no-files-found: warn

      # Every gate's full stdout+stderr (the summary's own `tail` field is 25
      # lines -- enough to see a gate is red, not enough to see why for a
      # verbose one like `cargo test --workspace`). Uploaded even on success so
      # a future failure is diagnosable from the artifact alone.
      - name: Upload full gate logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-gate-logs
          path: artifacts/ci/logs/
          if-no-files-found: warn

  # DOSSIER.md §21.4 (QA-001): the workspace's tests instrumented in their own target
  # directory, and the Python service modules under the standard-library tracer, held to the
  # floors in scripts/ci/coverage-expectations.json. A separate job: the instrumented build
  # doubles the baseline's compile time and never gates it.
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Into the toolchain rust-toolchain.toml pins: coverage.py uses the llvm-cov and
      # llvm-profdata of the rustc that built the instrumented tests.
      - name: Install llvm-tools
        run: rustup component add llvm-tools-preview

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python dependencies
        run: (cd python && uv sync --python 3.12 --frozen)

      - name: Start the deterministic dev stack
        env:
          QUANSIO_DEV_HEALTH_TIMEOUT: "180"
        run: bash scripts/dev/up

      - name: Measure and check coverage
        run: |
          python3 scripts/ci/coverage.py rust --out artifacts/coverage/rust.json
          uv run --project python python scripts/ci/coverage.py python --out artifacts/coverage/python.json
          python3 scripts/ci/coverage.py check --rust artifacts/coverage/rust.json \
            --python artifacts/coverage/python.json --out artifacts/coverage/report.json

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: artifacts/coverage/
          if-no-files-found: warn
