# Findings of the campaign. Severity: P0 (exploitable breach), P1 (a stated control absent or
# bypassable), P2 (defence in depth weakened), P3 (hygiene). No P0/P1 may be open.
findings:
  - id: F-1
    severity: P1
    status: fixed
    summary: The deployable migrated over its serving DSN, so it had to run as the schema owner or a superuser; no HTTP path ever ran under row-level security.
    fix: QUANSIO_MIGRATION_DATABASE_URL (crates/server/src/composition.rs); the campaign serves as a quansio_app login.
    regression: tests/security/test_qa007_campaign.py::test_the_server_serves_as_the_least_privileged_role
  - id: F-2
    severity: P1
    status: fixed
    summary: InstallSkill and DisableSkill had no authorization; a viewer could install under another owner's name and irreversibly deprecate production skills.
    fix: ManageTenant on both (crates/server/src/api/commands.rs; DOMAIN.md 11.5).
    regression: tests/security/test_qa007_campaign.py::test_role_escalation_is_refused
  - id: F-3
    severity: P1
    status: fixed
    summary: audit_entries was writable (UPDATE/DELETE) by the application role, and the unkeyed chain could be recomputed after a rewrite.
    fix: migrations/0022_audit_append_only.sql (grants revoked, triggers refuse UPDATE/DELETE/TRUNCATE).
    regression: tests/security/test_qa007_campaign.py::test_the_audit_log_is_append_only_for_the_serving_role
  - id: F-4
    severity: P3
    status: open
    summary: 26 catalog commands without a handler answer INTERNAL instead of a typed refusal; they fail closed.
    fix: none yet (recorded).
    regression: null
  - id: F-5
    severity: P2
    status: fixed
    summary: UpdateUserSettings failed for every caller under the application role (no user context under RLS) and echoed the database's message.
    fix: user context in the settings transaction; identity failures map to their own codes, database failures to INTERNAL without the message.
    regression: tests/security/test_qa007_campaign.py::test_settings_work_under_rls_and_refusals_do_not_echo_the_database
  - id: F-6
    severity: P2
    status: fixed
    summary: Artifact content relabelling compared exact lower-case spellings; TEXT/HTML, IMAGE/SVG+XML, text/xsl and *+xml were served as themselves.
    fix: case-insensitive, family-based relabelling (crates/server/src/api/artifacts.rs).
    regression: tests/security/test_qa007_campaign.py::test_active_content_is_never_served_renderable
  - id: F-7
    severity: P2
    status: fixed
    summary: A command could name another tenant's workspace_id; rows were written in the caller's tenant against the foreign workspace (invisible to its owner, an existence oracle, a contradictory pair).
    fix: the command surface refuses a workspace outside the caller's tenant (NOT_FOUND); migrations/0023 adds composite (tenant_id, workspace_id) keys.
    regression: tests/security/test_qa007_campaign.py::test_cross_tenant_commands_are_refused_and_change_nothing
  - id: F-8
    severity: P3
    status: open
    summary: Webhook creation accepts numeric IPv4 shorthands and names that resolve to loopback (2130706433, 127.1, localtest.me); every delivery attempt resolves them and the broker refuses (no connection made).
    fix: none needed for safety; creation-time normalization would give earlier feedback (recorded).
    regression: tests/security/test_qa007_campaign.py::test_ssrf_destinations_are_refused_at_creation_and_at_delivery
