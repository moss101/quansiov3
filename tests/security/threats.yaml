# QA-007 threat manifest: every DOSSIER.md §16 threat and every QA-007 build item, with the attacks
# that cover it. `tests/security/test_threat_manifest.py` parses the §16 table out of DOSSIER.md and
# the build items out of registries/tasks.json and fails if a row is missing here, if an attack
# names a test that does not exist, or if a P0/P1 finding is open.
#
# An attack is `<path>::<test function>`: Python tests under tests/ (the QA-007 campaign attacks the
# running server over HTTP as the least-privileged role), Rust tests under crates/*/tests/ (the
# owners' in-process suites, for surfaces the HTTP API does not reach — lease fencing, the qworkerd
# sandbox, DNS rebinding under a fixed resolver).

version: 1

threats:
  - threat: Model acts beyond intent
    attacks:
      - crates/server/tests/turn_loop.rs::a_call_outside_the_capability_projection_is_rejected_before_dispatch
