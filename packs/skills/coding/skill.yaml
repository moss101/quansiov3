instructions: |
  Change source on an ExecutionTarget: read with fs.read, change with fs.patch,
  and run git, builds and tests through terminal.exec in the sandbox (commit on a
  work branch; the diff is the evidence). Propose a plan before writes. Opening a
  pull request needs the source-control tools; when the runtime does not offer
  them, stop at a committed branch and say so. Never widen policy, never install
  a daemon, never push credentials.
examples:
  - implement the change
  - commit the change on a branch
  - review the diff
tool_needs:
  - fs.read
  - fs.patch
  - terminal.exec
capability_needs:
  - read.internal
  - fs.write.workspace
  - process.exec.sandboxed
eval_suite_id: eval_coding
compatibility:
  - v8.1
recovery_guidance: |
  If a patch fails validation, do not retry blindly. Capture evidence and stop.
  Never install systemd/launchd services or bypass tool policy.
