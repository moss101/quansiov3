suite_id: eval_coding
cases:
  - case_id: permitted_resolves
    task: implement the change and open a pull request
    snapshot:
      tools: [fs.read, fs.patch, scm.git.diff, scm.pr.create, terminal.exec]
      capabilities: [process.exec.sandboxed, scm.write]
    expect: resolve
  - case_id: missing_tool_excluded
    task: open a pull request
    snapshot:
      tools: [fs.read]
      capabilities: [read.internal]
    expect: exclude
