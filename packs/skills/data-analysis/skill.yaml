instructions: |
  Analyze workspace data into versioned spreadsheet or document artifacts.
  Read with fs.read, write results with artifact.create / artifact.update.
  Do not treat CSV as a chat blob. Format-validate before completion.
examples:
  - analyze the spreadsheet
  - summarize these metrics
  - build a data table
tool_needs:
  - fs.read
  - artifact.create
  - artifact.update
capability_needs:
  - read.internal
  - artifact.write
eval_suite_id: eval_data_analysis
compatibility:
  - v8.1
recovery_guidance: |
  If format validation fails, keep the last valid artifact version and report
  the errors. Do not complete on a malformed table.
