    input_schema:
      type: object
      additionalProperties: false
      properties:
        artifact_id: { type: string, minLength: 1 }
        format: { type: string, enum: [pdf, pptx] }
        content_base64: { type: string, maxLength: 23000000, description: "The pptx package as base64; omitted for pdf." }
        content_digest: { type: string, minLength: 64, maxLength: 64, description: "SHA-256 of the pptx package; omitted for pdf." }
      required: [artifact_id, format]
    output_schema:
      type: object
      additionalProperties: false
      properties:
        artifact_id: { type: string }
        version_id: { type: string }
        version: { type: integer }
        format: { type: string }
        content_digest: { type: string }
        size_bytes: { type: integer }
        pages: { type: integer }
        replayed: { type: boolean }
        trust: { type: string }
      required: [artifact_id, version_id, version, format, content_digest]

  - name: deck.deliver
    version: 1
    description: >-
      Present a deck: the completion gate. It succeeds only when the pages of the deck's current version are all
      ready, and returns the deck's stable URI; otherwise it fails with DECK_NOT_DELIVERABLE naming each page.
