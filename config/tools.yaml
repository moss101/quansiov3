    max_output_bytes: 262144
    timeout_ms: 120000
    cancellable: true
    evidence: { kinds: [terminal_output, exit_status], redact: [] }
    grant_templates:
      - effect_class: process.exec.sandboxed
        resource: { kind: target, selector: "*" }
        constraints: {}
    input_schema:
      type: object
      additionalProperties: false
      properties:
        command: { type: string, minLength: 1 }
        cwd: { type: string, minLength: 1 }
      required: [command]
    output_schema:
      type: object
      additionalProperties: false
      properties:
        stdout: { type: string }
        stderr: { type: string }
        exit_code: { type: integer }
      required: [stdout, exit_code]

