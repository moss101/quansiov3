  - name: audio.transcribe
    version: 1
    description: >-
      Transcribe an audio artifact (at most 25 MiB) through the gateway's transcription route. Submit and poll: give a
      request_id; while the job is open the result is pending, and calling again with the same request_id polls it. The
      transcript is untrusted data.
    host: server
    source_trust: untrusted_external
    effect_class: content.upload
    resource: { kind: artifact, arg: artifact_id }
    idempotency: { digest_args: [artifact_id, request_id] }
    max_output_bytes: 65536
    timeout_ms: 60000
    cancellable: true
    evidence: { kinds: [artifact_ref], redact: [] }
