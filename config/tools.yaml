      parent_id?, completion_contract?}), nodes_update ({node_id, expected_revision, to}),
      edges_add ({id, from_node_id, to_node_id, kind}) and edges_remove ({edge_id,
      expected_revision}); edges name existing node ids. The run and workspace are fixed
      by the runtime.
