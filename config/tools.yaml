        request_id: { type: string, minLength: 8, maxLength: 64, description: "Your idempotency id for this transcription." }
        language: { type: string, minLength: 2, maxLength: 12 }
        wait_ms: { type: integer, minimum: 0, maximum: 30000 }
      required: [artifact_id, request_id]
    output_schema:
      type: object
      additionalProperties: false
