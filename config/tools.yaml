  # ---- Output generators (ADP-006, DOMAIN.md 10.4). Server-hosted: the authority verifies the deliverable before it
  # commits a version; worker-side operations (a browser layout, ffmpeg) sit behind ports the host calls.
  - name: deck.render
    version: 1
    description: >-
      Lay out a presentation's pages in the render sandbox, measure each (overflow, empty, alt text, contrast,
      source text, network) and record the deck pages with a state per slide. Give only the pages you built; a
      slide whose source is unchanged keeps its page. A page that fails is recorded as failed_quality, not refused.
    host: server
    source_trust: untrusted_external
    effect_class: content.upload
    resource: { kind: artifact, arg: artifact_id }
    idempotency: { digest_args: [artifact_id, css, pages] }
    max_output_bytes: 65536
    timeout_ms: 180000
    cancellable: false
    evidence: { kinds: [artifact_ref, screenshot], redact: [] }
    grant_templates:
      - effect_class: content.upload
        resource: { kind: artifact, selector: "*" }
        constraints: {}
    input_schema:
      type: object
      additionalProperties: false
      properties:
        artifact_id: { type: string, minLength: 1, description: "The presentation artifact." }
        css: { type: string, maxLength: 131072, description: "The shared stylesheet of the template." }
        pages:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            properties:
              index: { type: integer, minimum: 0, maximum: 99 }
              fragment: { type: string, minLength: 1, maxLength: 262144, description: "The slide's section element." }
            required: [index, fragment]
      required: [artifact_id, css, pages]
    output_schema:
      type: object
      additionalProperties: false
      properties:
        artifact_id: { type: string }
        version_id: { type: string }
        version: { type: integer }
        deck_version_id: { type: string }
        deliverable: { type: boolean }
        slides:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              index: { type: integer }
              state: { type: string, enum: [pending, edited, failed_quality, ready] }
              failed_rules: { type: array, items: { type: string } }
            required: [index, state, failed_rules]
        evidence_ids: { type: array, items: { type: string } }
        trust: { type: string }
      required: [artifact_id, version_id, version, deliverable, slides]

  - name: deck.export
    version: 1
    description: >-
      Export a deliverable deck as pdf (printed from the stored pages) or pptx (built by the plane and verified part by
      part). Refused with DECK_NOT_DELIVERABLE while any page is pending, edited or failing.
    host: server
    source_trust: untrusted_external
    effect_class: content.upload
    resource: { kind: artifact, arg: artifact_id }
    idempotency: { digest_args: [artifact_id, format, content_digest] }
