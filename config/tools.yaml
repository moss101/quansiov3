# Tool Registry declarations (DOMAIN.md §7.5). Control-plane data, not source constants
# (AGENTS.md invariant 18). The registry is validated against the generated tool catalog
# `schemas/catalog/tools.yaml`; a declared tool that is not in the catalog, or a catalog
# tool with no declaration, fails the contract test.
#
# Every `input_schema`/`output_schema` uses only the vocabulary in crates/tools/src/schema.rs
# and closes every object with `additionalProperties: false`, so an unknown argument field
# is always rejected before dispatch.
#
# `grant_templates` state the minimum authority that exposes the tool to a model; the
# capability projection must hold a grant of the same effect class whose resource region
# overlaps the template.
version: 1

# Catalog families reserved for later materialization. These names appear in the generated
# catalog (DOMAIN.md §7.5) but have no callable declaration yet, so a call naming one (or a
# concrete operation under one) is rejected as an unregistered tool. CAP-*/EXEC-* register
# the concrete operations with their own schemas.
families:
  - name: connector.<id>.<op>
    materialized_by: CAP-003
  - name: scm.git.<op>
    materialized_by: EXEC-009
  - name: scm.pr.<op>
    materialized_by: EXEC-009

tools:
  - name: fs.read
    version: 1
    description: Read a file inside the run's execution-target root.
    host: qworkerd
    source_trust: untrusted_external
    effect_class: read.internal
    resource: { kind: fs, arg: path }
    idempotency: { digest_args: [path] }
    max_output_bytes: 1048576
    timeout_ms: 30000
    cancellable: true
    evidence: { kinds: [file_read], redact: [] }
    grant_templates:
      - effect_class: read.internal
        resource: { kind: fs, selector: "**" }
        constraints: {}
    input_schema:
      type: object
      additionalProperties: false
      properties:
        path: { type: string, minLength: 1 }
      required: [path]
    output_schema:
      type: object
      additionalProperties: false
      properties:
        content: { type: string }
        bytes: { type: integer }
        truncated: { type: boolean }
      required: [content, bytes, truncated]

  - name: fs.write
    version: 1
    description: Write a file, inside the execution-target root or on the host, at the scope the runtime derives.
    host: qworkerd
    source_trust: untrusted_external
    effect_class: fs_write_scope
    resource: { kind: fs, arg: path }
    idempotency: { digest_args: [path, content_digest] }
    max_output_bytes: 65536
    timeout_ms: 30000
    cancellable: false
    evidence: { kinds: [file_write], redact: [] }
    grant_templates:
      - effect_class: fs.write.workspace
        resource: { kind: fs, selector: "**" }
        constraints: {}
      - effect_class: fs.write.host
        resource: { kind: fs, selector: "**" }
        constraints: {}
    input_schema:
      type: object
      additionalProperties: false
      properties:
        path: { type: string, minLength: 1 }
        content: { type: string }
        content_digest: { type: string, minLength: 1 }
        # The digest of the file as the caller last read it (DOMAIN.md 8.7 G): a different digest at write time is
        # FILE_EDIT_CONFLICT and the file is untouched. Absent, the write is unconditional, as before.
        base_digest: { type: string, minLength: 1 }
      required: [path, content, content_digest]
    output_schema:
      type: object
      additionalProperties: false
      properties:
        bytes: { type: integer }
      required: [bytes]

  - name: fs.patch
    version: 1
    description: Apply a patch to a file at the scope the runtime derives.
    host: qworkerd
    source_trust: untrusted_external
    effect_class: fs_write_scope
    resource: { kind: fs, arg: path }
    idempotency: { digest_args: [path, patch] }
    max_output_bytes: 65536
    timeout_ms: 30000
    cancellable: false
    evidence: { kinds: [file_patch], redact: [] }
    grant_templates:
      - effect_class: fs.write.workspace
        resource: { kind: fs, selector: "**" }
        constraints: {}
      - effect_class: fs.write.host
        resource: { kind: fs, selector: "**" }
        constraints: {}
    input_schema:
      type: object
      additionalProperties: false
      properties:
        path: { type: string, minLength: 1 }
        patch: { type: string, minLength: 1 }
        # The digest of the file as the caller last read it (DOMAIN.md 8.7 G); see fs.write.
        base_digest: { type: string, minLength: 1 }
      required: [path, patch]
    output_schema:
      type: object
      additionalProperties: false
      properties:
        applied: { type: boolean }
      required: [applied]

  - name: terminal.exec
    version: 1
    description: Run one command in the run's execution target and return bounded output.
    host: qworkerd
    source_trust: untrusted_external
    effect_class: process.exec.sandboxed
    resource: { kind: target, selector: "*" }
    idempotency: { digest_args: [command, cwd] }
    max_output_bytes: 262144
    timeout_ms: 120000
    cancellable: true
    evidence: { kinds: [terminal_output, exit_status], redact: [] }
    grant_templates:
      - effect_class: process.exec.sandboxed
        resource: { kind: target, selector: "*" }
        constraints: {}
    input_schema:
      type: object
      additionalProperties: false
      properties:
        command: { type: string, minLength: 1 }
        cwd: { type: string, minLength: 1 }
      required: [command]
    output_schema:
      type: object
      additionalProperties: false
      properties:
        stdout: { type: string }
        stderr: { type: string }
        exit_code: { type: integer }
      required: [stdout, exit_code]

  - name: process.spawn
    version: 1
    description: Start a long-running process in the run's execution target.
    host: qworkerd
    source_trust: untrusted_external
    effect_class: process.exec.sandboxed
    resource: { kind: target, selector: "*" }
    idempotency: { digest_args: [command, cwd] }
    max_output_bytes: 65536
    timeout_ms: 30000
    cancellable: true
    evidence: { kinds: [process_started], redact: [] }
    grant_templates:
      - effect_class: process.exec.sandboxed
        resource: { kind: target, selector: "*" }
        constraints: {}
    input_schema:
      type: object
      additionalProperties: false
      properties:
        command: { type: string, minLength: 1 }
        cwd: { type: string, minLength: 1 }
      required: [command]
    output_schema:
      type: object
      additionalProperties: false
      properties:
        process_id: { type: string }
      required: [process_id]

  # ---- Managed browser (EXEC-009, hardened by ADP-001; DOMAIN.md §8.4, §7.5) -----------------------
  #
  # Every browser tool names the page it acts on in a form the driver can check against the live
  # page (document revision, snapshot ref or capture point), so there is no selector-only mutating
  # tool: an unfenced click or type is not callable. `side_effect` is the tool's side-effect class;
  # `config/effects.yaml` maps each class onto the effect class and tier the Effect Ledger records,
  # and the registry refuses a declaration whose `effect_class` disagrees with that mapping.
  # All results are page content: `source_trust: untrusted_external`.

  - name: browser.navigate
    version: 2
    description: Navigate a tab (or open a new one) to an http or https destination. Needs the tab's document revision; refused for any other scheme or for a URL with credentials.
    host: browser
    source_trust: untrusted_external
    side_effect: open_world_mutation
    effect_class: network.egress.new_destination
    resource: { kind: domain, arg: url }
    idempotency: { digest_args: [url, session_id, tab_id, expected_document_revision] }
    max_output_bytes: 65536
    timeout_ms: 60000
    cancellable: true
    evidence: { kinds: [page_navigation], redact: [] }
    grant_templates:
      - effect_class: network.egress.new_destination
        resource: { kind: domain, selector: "*" }
        constraints: {}
    input_schema:
      type: object
      additionalProperties: false
      properties:
        url: { type: string, minLength: 1 }
        session_id: { type: string, minLength: 1 }
        tab_id: { type: string, minLength: 1 }
        expected_document_revision: { type: string, minLength: 1 }
      required: [url, session_id]
    output_schema:
      type: object
      additionalProperties: false
      properties:
        navigated: { type: boolean }
        completed: { type: boolean }
        tab_id: { type: string }
        url: { type: string }
        document_revision: { type: string }
        loading: { type: boolean }
        input_origin: { type: string }
        warnings: { type: array, items: { type: string } }
        dialog_pending:
          type: object
          additionalProperties: false
          properties:
            id: { type: string }
            kind: { type: string }
            message: { type: string }
            url: { type: string }
            default_prompt: { type: string }
            document_revision: { type: string }
        certificate_decision_required:
          type: object
          additionalProperties: false
          properties:
            id: { type: string }
            origin: { type: string }
            error_type: { type: string }
            url: { type: string }
            status: { type: string }
            certificate_sha256: { type: [string, "null"] }
            decided_by: { type: [string, "null"] }
      required: [navigated]

  - name: browser.observe
    version: 1
    description: Read a tab. Returns its readable text, a snapshot id and an element ref for each interactive element, the tab's document revision, and any dialog, certificate error, download or blocked popup. A tab with a dialog or certificate error pending is not read.
    host: browser
    source_trust: untrusted_external
    side_effect: read
    effect_class: read.external
    resource: { kind: domain, selector: "*" }
    idempotency: { digest_args: [session_id, tab_id, include_screenshot] }
    max_output_bytes: 1048576
    timeout_ms: 60000
    cancellable: true
    evidence: { kinds: [page_observation], redact: [] }
    grant_templates:
      - effect_class: read.external
        resource: { kind: domain, selector: "*" }
        constraints: {}
    input_schema:
      type: object
      additionalProperties: false
      properties:
        session_id: { type: string, minLength: 1 }
        tab_id: { type: string, minLength: 1 }
        include_screenshot: { type: boolean }
      required: [session_id]
    output_schema:
      type: object
      additionalProperties: false
      properties:
        tab_id: { type: string }
        url: { type: string }
        document_revision: { type: string }
        page_available: { type: boolean }
        snapshot_id: { type: string }
        title: { type: string }
        text: { type: string }
        text_truncated: { type: boolean }
        elements:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              ref: { type: string }
              role: { type: string }
              name: { type: string }
              tag: { type: string }
              frame_origin: { type: string }
              sensitive: { type: string }
            required: [ref, role, tag]
        elements_truncated: { type: boolean }
        frames_skipped: { type: integer }
        dialog:
          type: [object, "null"]
          additionalProperties: false
          properties:
            id: { type: string }
            kind: { type: string }
            message: { type: string }
            url: { type: string }
            default_prompt: { type: string }
            document_revision: { type: string }
        certificates:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              id: { type: string }
              origin: { type: string }
              error_type: { type: string }
              url: { type: string }
              status: { type: string }
              certificate_sha256: { type: [string, "null"] }
              decided_by: { type: [string, "null"] }
        downloads:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              id: { type: string }
              url: { type: string }
              suggested_filename: { type: string }
              state: { type: string }
              received_bytes: { type: integer }
              total_bytes: { type: integer }
              file: { type: [string, "null"] }
              sha256: { type: [string, "null"] }
              failure: { type: [string, "null"] }
        popups_blocked:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              url: { type: string }
              reason: { type: string }
        handoffs_blocked:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              scheme: { type: string }
              reason: { type: string }
        console:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              level: { type: string }
              text: { type: string }
        permissions_denied: { type: array, items: { type: string } }
        capture:
          type: object
          additionalProperties: false
          properties:
            tab_id: { type: string }
            capture_id: { type: string }
            document_revision: { type: string }
            width: { type: integer }
            height: { type: integer }
            scroll_x: { type: integer }
            scroll_y: { type: integer }
            tile_px: { type: integer }
            png_bytes: { type: integer }
      required: [tab_id, document_revision, page_available]

  - name: browser.click
    version: 2
    description: Click an element the model observed. The target is {snapshot_id, ref} or {capture_id, x, y} plus the document revision; a stale revision, snapshot, capture or fingerprint never clicks. The consequence class is refined from the control the click lands on.
    host: browser
    source_trust: untrusted_external
    side_effect: potential_external_effect
    effect_class: computer.input.privileged
    resource: { kind: domain, selector: "*" }
    idempotency: { digest_args: [session_id, tab_id, expected_document_revision, snapshot_id, ref, capture_id, x, y] }
    max_output_bytes: 65536
    timeout_ms: 60000
    cancellable: true
    evidence: { kinds: [browser_action], redact: [] }
    grant_templates:
      - effect_class: computer.input.privileged
        resource: { kind: domain, selector: "*" }
        constraints: {}
    input_schema:
      type: object
      additionalProperties: false
      properties:
        session_id: { type: string, minLength: 1 }
        tab_id: { type: string, minLength: 1 }
        expected_document_revision: { type: string, minLength: 1 }
        snapshot_id: { type: string, minLength: 1 }
        ref: { type: string, minLength: 1 }
        capture_id: { type: string, minLength: 1 }
        x: { type: number }
        y: { type: number }
      required: [session_id, tab_id, expected_document_revision]
    output_schema:
      type: object
      additionalProperties: false
      properties:
        clicked: { type: boolean }
        completed: { type: boolean }
        tab_id: { type: string }
        url: { type: string }
        document_revision: { type: string }
        loading: { type: boolean }
        input_origin: { type: string }
        warnings: { type: array, items: { type: string } }
        hit:
          type: object
          additionalProperties: false
          properties:
            tag: { type: [string, "null"] }
            role: { type: string }
            name: { type: string }
            frame_origin: { type: [string, "null"] }
        classified:
          type: [object, "null"]
          additionalProperties: false
          properties:
            effect_class: { type: [string, "null"] }
            tier: { type: [integer, "null"] }
            reason: { type: string }
        dialog_pending:
          type: object
          additionalProperties: false
          properties:
            id: { type: string }
            kind: { type: string }
            message: { type: string }
            url: { type: string }
            default_prompt: { type: string }
            document_revision: { type: string }
        certificate_decision_required:
          type: object
          additionalProperties: false
          properties:
            id: { type: string }
            origin: { type: string }
            error_type: { type: string }
            url: { type: string }
            status: { type: string }
            certificate_sha256: { type: [string, "null"] }
            decided_by: { type: [string, "null"] }
      required: [clicked]

  - name: browser.type
    version: 2
    description: Type into a text field the model observed. The text may contain {{secret:<name>.<field>}} placeholders, which only the runtime resolves, at insertion, after the live origin of the top frame and of the field's frame is checked against the secret's allowed origins. Plain text into a password, one-time-code or card field is refused.
    host: browser
    source_trust: untrusted_external
    side_effect: local_mutation
    effect_class: computer.input.privileged
    resource: { kind: domain, selector: "*" }
    idempotency: { digest_args: [session_id, tab_id, expected_document_revision, snapshot_id, ref, capture_id, x, y, text, clear] }
    max_output_bytes: 65536
    timeout_ms: 60000
    cancellable: true
    evidence: { kinds: [browser_action], redact: [text] }
    grant_templates:
      - effect_class: computer.input.privileged
        resource: { kind: domain, selector: "*" }
        constraints: {}
    input_schema:
      type: object
      additionalProperties: false
      properties:
        session_id: { type: string, minLength: 1 }
        tab_id: { type: string, minLength: 1 }
        expected_document_revision: { type: string, minLength: 1 }
        snapshot_id: { type: string, minLength: 1 }
        ref: { type: string, minLength: 1 }
        capture_id: { type: string, minLength: 1 }
        x: { type: number }
        y: { type: number }
        text: { type: string }
        clear: { type: boolean }
      required: [session_id, tab_id, expected_document_revision, text]
    output_schema:
      type: object
      additionalProperties: false
      properties:
        typed: { type: boolean }
        completed: { type: boolean }
        tab_id: { type: string }
        url: { type: string }
        document_revision: { type: string }
        loading: { type: boolean }
        input_origin: { type: string }
        sensitive_field: { type: string }
        used_secrets:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              name: { type: string }
              field: { type: string }
        warnings: { type: array, items: { type: string } }
        dialog_pending:
          type: object
          additionalProperties: false
          properties:
            id: { type: string }
            kind: { type: string }
            message: { type: string }
            url: { type: string }
            default_prompt: { type: string }
            document_revision: { type: string }
        certificate_decision_required:
          type: object
          additionalProperties: false
          properties:
            id: { type: string }
            origin: { type: string }
            error_type: { type: string }
            url: { type: string }
            status: { type: string }
            certificate_sha256: { type: [string, "null"] }
            decided_by: { type: [string, "null"] }
      required: [typed]

  - name: browser.press_key
    version: 1
    description: Press a key (Enter, Tab, Escape, an arrow, a single character, or a chord such as Control+a) in a tab. A printable key is refused while focus is in a password, one-time-code or card field.
    host: browser
    source_trust: untrusted_external
    side_effect: local_mutation
    effect_class: computer.input.privileged
    resource: { kind: domain, selector: "*" }
    idempotency: { digest_args: [session_id, tab_id, expected_document_revision, key] }
    max_output_bytes: 65536
    timeout_ms: 60000
    cancellable: true
    evidence: { kinds: [browser_action], redact: [] }
    grant_templates:
      - effect_class: computer.input.privileged
        resource: { kind: domain, selector: "*" }
        constraints: {}
    input_schema:
      type: object
      additionalProperties: false
      properties:
        session_id: { type: string, minLength: 1 }
        tab_id: { type: string, minLength: 1 }
        expected_document_revision: { type: string, minLength: 1 }
        key: { type: string, minLength: 1, maxLength: 32 }
      required: [session_id, tab_id, expected_document_revision, key]
    output_schema:
      type: object
      additionalProperties: false
      properties:
        pressed: { type: string }
        completed: { type: boolean }
        tab_id: { type: string }
        url: { type: string }
        document_revision: { type: string }
        loading: { type: boolean }
        input_origin: { type: string }
        warnings: { type: array, items: { type: string } }
        dialog_pending:
          type: object
          additionalProperties: false
          properties:
            id: { type: string }
            kind: { type: string }
            message: { type: string }
            url: { type: string }
            default_prompt: { type: string }
            document_revision: { type: string }
        certificate_decision_required:
          type: object
          additionalProperties: false
          properties:
            id: { type: string }
            origin: { type: string }
            error_type: { type: string }
            url: { type: string }
            status: { type: string }
            certificate_sha256: { type: [string, "null"] }
            decided_by: { type: [string, "null"] }
      required: [pressed]

  - name: browser.handle_dialog
    version: 1
    description: Answer the JavaScript dialog (alert, confirm, prompt, beforeunload) that is pending in a tab. A pending dialog fences every other browser action on the tab; the answer must quote the dialog's exact id and the document revision it was raised under.
    host: browser
    source_trust: untrusted_external
    side_effect: local_mutation
    effect_class: computer.input.privileged
    resource: { kind: domain, selector: "*" }
    idempotency: { digest_args: [session_id, tab_id, expected_document_revision, dialog_id, accept, prompt_text] }
    max_output_bytes: 65536
    timeout_ms: 60000
    cancellable: true
    evidence: { kinds: [browser_action], redact: [prompt_text] }
    grant_templates:
      - effect_class: computer.input.privileged
        resource: { kind: domain, selector: "*" }
        constraints: {}
    input_schema:
      type: object
      additionalProperties: false
      properties:
        session_id: { type: string, minLength: 1 }
        tab_id: { type: string, minLength: 1 }
        expected_document_revision: { type: string, minLength: 1 }
        dialog_id: { type: string, minLength: 1 }
        accept: { type: boolean }
        prompt_text: { type: string }
      required: [session_id, tab_id, expected_document_revision, dialog_id, accept]
    output_schema:
      type: object
      additionalProperties: false
      properties:
        handled: { type: boolean }
        dialog_id: { type: string }
        accepted: { type: boolean }
        completed: { type: boolean }
        tab_id: { type: string }
        url: { type: string }
        document_revision: { type: string }
        loading: { type: boolean }
        input_origin: { type: string }
        warnings: { type: array, items: { type: string } }
        dialog_pending:
          type: object
          additionalProperties: false
          properties:
            id: { type: string }
            kind: { type: string }
            message: { type: string }
            url: { type: string }
            default_prompt: { type: string }
            document_revision: { type: string }
      required: [handled]

  - name: browser.extract
    version: 1
    description: Extract text, HTML or JSON from an element of the current page.
    host: browser
    source_trust: untrusted_external
    side_effect: read
    effect_class: read.external
    resource: { kind: domain, selector: "*" }
    idempotency: { digest_args: [selector, format, session_id, tab_id] }
    max_output_bytes: 1048576
    timeout_ms: 60000
    cancellable: true
    evidence: { kinds: [page_extract], redact: [] }
    grant_templates:
      - effect_class: read.external
        resource: { kind: domain, selector: "*" }
        constraints: {}
    input_schema:
      type: object
      additionalProperties: false
      properties:
        selector: { type: string, minLength: 1 }
        format: { type: string, enum: [text, html, json] }
        session_id: { type: string, minLength: 1 }
        tab_id: { type: string, minLength: 1 }
      required: [selector, session_id]
    output_schema:
      type: object
      additionalProperties: false
      properties:
        content: { type: string }
        tab_id: { type: string }
        document_revision: { type: string }
        truncated: { type: boolean }
      required: [content]

  - name: browser.screenshot
    version: 2
    description: Capture the tab's viewport as an evidence artifact. Returns a capture id bound to this screenshot, the document revision and the scroll position; a point read from it can be clicked with {capture_id, x, y}.
    host: browser
    source_trust: untrusted_external
    side_effect: read_sensitive
    effect_class: read.internal
    resource: { kind: target, selector: "browser" }
    idempotency: { digest_args: [session_id, tab_id] }
    max_output_bytes: 65536
    timeout_ms: 60000
    cancellable: true
    evidence: { kinds: [screenshot], redact: [] }
    grant_templates:
      - effect_class: read.internal
        resource: { kind: target, selector: "browser" }
        constraints: {}
    input_schema:
      type: object
      additionalProperties: false
      properties:
        session_id: { type: string, minLength: 1 }
        tab_id: { type: string, minLength: 1 }
      required: [session_id]
    output_schema:
      type: object
      additionalProperties: false
      properties:
        artifact_id: { type: string }
        tab_id: { type: string }
