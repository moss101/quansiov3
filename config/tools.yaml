  - name: video.edit
    version: 1
    description: >-
      Apply a batch of at most 64 typed edit operations to a video timeline. expected_revision must be the current
      revision; the batch is atomic (all or none); dry_run validates and reports without writing.
    host: server
    source_trust: untrusted_external
    effect_class: content.upload
    resource: { kind: artifact, arg: artifact_id }
    idempotency: { digest_args: [artifact_id, expected_revision, ops, dry_run] }
    max_output_bytes: 65536
    timeout_ms: 60000
    cancellable: false
    evidence: { kinds: [artifact_ref], redact: [] }
    grant_templates:
      - effect_class: content.upload
        resource: { kind: artifact, selector: "*" }
        constraints: {}
    input_schema:
      type: object
      additionalProperties: false
      properties:
        artifact_id: { type: string, minLength: 1, description: "The video timeline artifact." }
        expected_revision: { type: integer, minimum: 1 }
        dry_run: { type: boolean }
        ops:
          type: array
          minItems: 1
          maxItems: 64
          items:
            type: object
            additionalProperties: false
            properties:
              op:
                type: string
                enum: [add_media, remove_media, add_track, add_clips, trim_clip, split_clip, move_clip, remove_clips, set_keyframes, set_volume, add_subtitles, remove_subtitles, subtitles_from_transcript, set_output]
              id: { type: string, maxLength: 32 }
              media_id: { type: string, maxLength: 32 }
              track_id: { type: string, maxLength: 32 }
              clip_id: { type: string, maxLength: 32 }
              new_clip_id: { type: string, maxLength: 32 }
              artifact_id: { type: string }
              transcript_artifact_id: { type: string }
              id_prefix: { type: string, maxLength: 24 }
              kind: { type: string, enum: [video, audio, image, subtitle] }
              has_audio: { type: boolean }
              duration_ms: { type: integer, minimum: 1 }
              at_ms: { type: integer, minimum: 0 }
              start_ms: { type: integer, minimum: 0 }
              in_ms: { type: integer, minimum: 0 }
              out_ms: { type: integer, minimum: 1 }
              offset_ms: { type: integer, minimum: 0 }
              volume: { type: number, minimum: 0, maximum: 4 }
              width: { type: integer, minimum: 16 }
              height: { type: integer, minimum: 16 }
              fps: { type: integer, minimum: 1 }
              clip_ids: { type: array, maxItems: 64, items: { type: string, maxLength: 32 } }
              ids: { type: array, maxItems: 64, items: { type: string, maxLength: 32 } }
              clips:
                type: array
                maxItems: 64
                items:
                  type: object
                  additionalProperties: false
                  properties:
                    id: { type: string, maxLength: 32 }
                    media_id: { type: string, maxLength: 32 }
                    start_ms: { type: integer, minimum: 0 }
                    in_ms: { type: integer, minimum: 0 }
                    out_ms: { type: integer, minimum: 1 }
                    volume: { type: number, minimum: 0, maximum: 4 }
                  required: [id, media_id, start_ms, in_ms, out_ms]
              keyframes:
                type: array
                maxItems: 64
                items:
                  type: object
                  additionalProperties: false
                  properties:
                    at_ms: { type: integer, minimum: 0 }
                    property: { type: string, enum: [opacity, volume, scale, x, y] }
                    value: { type: number }
                  required: [at_ms, property, value]
              subtitles:
                type: array
                maxItems: 64
                items:
                  type: object
                  additionalProperties: false
                  properties:
                    id: { type: string, maxLength: 32 }
                    start_ms: { type: integer, minimum: 0 }
                    end_ms: { type: integer, minimum: 1 }
                    text: { type: string, minLength: 1, maxLength: 500 }
                  required: [id, start_ms, end_ms, text]
            required: [op]
      required: [artifact_id, expected_revision, ops]
    output_schema:
      type: object
      additionalProperties: false
      properties:
        artifact_id: { type: string }
        revision: { type: integer }
        applied: { type: integer }
        dry_run: { type: boolean }
        replayed: { type: boolean }
        version_id: { type: string }
        duration_ms: { type: integer }
        summary:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              op: { type: string }
              detail: { type: string }
            required: [op, detail]
        trust: { type: string }
      required: [artifact_id, revision, applied, dry_run, duration_ms, summary]

