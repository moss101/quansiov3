# Quansio V8.1 model catalog (DOSSIER.md §7, D-018).
# Model identifiers live here, never as source constants. The model gateway
# (python/intelligence/model_gateway, INT-002/INT-003) is the only consumer and the
# only place provider credentials exist.
#
# cost_class: relative spend band used for budget routing (OPS-004).
# dlp_eligible: whether the provider may receive content classified above the default
#               data-handling class (DOSSIER.md §16); false means the runtime must not
#               route protected content here.

version: 1
# First-party providers (anthropic, openai) are addressed from the endpoint root, without an
# API version: their adapters send the version in the path (`/v1/messages`,
# `/v1/chat/completions`, `/v1/embeddings`), because that version is the provider's own. A
# versioned `base_url` there would double the segment and address a route the provider does
# not serve.
#
# The openai-compatible provider is the opposite, on purpose: its base URL follows the OpenAI
# SDK convention every such service documents and includes the service's own version segment
# (`http://127.0.0.1:11434/v1`, `http://127.0.0.1:59020/v1` for the dev stub,
# `https://api.z.ai/api/paas/v4`), and the adapter's paths are relative to it
# (`/chat/completions`, `/embeddings`). Services disagree on the segment (`v1`, `v4`, none),
# so it has to be part of the configured URL.
providers:
  anthropic:
    kind: anthropic
    base_url: https://api.anthropic.com
    credential_handle: provider/anthropic
  openai:
    kind: openai
    base_url: https://api.openai.com
    credential_handle: provider/openai
  openai-compatible:
    # Self-hosted / local inference endpoints use the OpenAI-compatible adapter (OD-004).
    kind: openai_compatible
    base_url_env: QUANSIO_OPENAI_COMPATIBLE_BASE_URL
    credential_handle_env: QUANSIO_OPENAI_COMPATIBLE_KEY_HANDLE

routing:
  # Pre-call routing is deterministic: no router/planner/judge model call may be
  # inserted before the selected primary model (DOSSIER.md §7).
  strategy: deterministic
  primary: anthropic-sonnet
  fallback_order: [openai-gpt, openai-compatible-local]
  # The model that judges completion claims (RUN-008). It differs from the primary, so a
  # contract that requires an independent model can be verified.
  verification: anthropic-opus

models:
  - id: anthropic-sonnet
    provider: anthropic
    model_id: claude-sonnet-4-5
    capabilities: [tools, vision, documents, streaming, structured_output, prompt_caching]
    context_window: 200000
    cost_class: standard
    dlp_eligible: true
  - id: anthropic-opus
    provider: anthropic
    model_id: claude-opus-4-1
    capabilities: [tools, vision, documents, streaming, structured_output, prompt_caching]
    context_window: 200000
    cost_class: premium
    dlp_eligible: true
  - id: openai-gpt
    provider: openai
    model_id: gpt-5.2
    capabilities: [tools, vision, streaming, structured_output]
    context_window: 128000
    cost_class: standard
    dlp_eligible: true
  - id: openai-compatible-local
    provider: openai-compatible
    model_id: local-instruct
    capabilities: [tools, streaming]
    context_window: 32768
    cost_class: low
    dlp_eligible: false
  # The embedding route the derived vector index is built with (INT-011). The embedding
  # request class requires the `embeddings` capability, so this entry is what makes a
  # semantic retrieval route resolvable at all; `context_window` is the endpoint's maximum
  # input length, since an embedding model has no conversational window. The index pins the
  # width in `migrations/` (derived.embeddings.dimensions), so a route that produced another
  # width would be refused rather than written.
  - id: openai-text-embedding-3-small
    provider: openai
    model_id: text-embedding-3-small
    capabilities: [embeddings]
    context_window: 8191
    cost_class: low
    dlp_eligible: true
    # The vector width this route produces. A model that declares the `embeddings`
    # capability must declare its width, and the derived index refuses a route whose width
    # differs from the width it pins, so failover can never cross embedding spaces.
    embedding_dimensions: 1536
  # The transcription route (ADP-006, DOMAIN.md 10.4 E). A model that declares the `transcription` capability
  # is a speech-to-text route: the gateway's `transcribe` takes the first one on an enabled provider, in this
  # order, so adding a provider is adding a row. It is never a chat route (it declares no `tools` or
  # `streaming`) and not in `routing.fallback_order`. The segment timestamps the transcript carries need a
  # model whose answer includes them (`verbose_json` with segment granularity). `context_window` is the
  # endpoint's maximum input in bytes (25 MiB), as the embedding route's is its maximum input length.
  - id: openai-whisper
    provider: openai
    model_id: whisper-1
    capabilities: [transcription]
    context_window: 26214400
    cost_class: low
    dlp_eligible: true
