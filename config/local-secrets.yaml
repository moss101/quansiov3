# The person's own secrets on their own machine (ADP-009, DOMAIN.md 13.9). Policy lives here, never as a source constant (D-018).
# A flat map of dotted keys to scalars: the desktop ships this file beside its main bundle and reads it with the shell's small
# parser, and schemas/json/local-secrets-config.schema.json bounds every value, so a configuration cannot make a stored list
# unbounded, a confirmation immortal or a one-time payment value long-lived. Nothing here names a path or a secret.
version: 1

# Off: every passwords, import and payment channel answers POLICY_DENIED and nothing is read or stored.
local_secrets.enabled: true

# The human-only password manager (13.9 A): the most entries, the longest username or password, and the most suggestions listed.
local_secrets.passwords_max: 2000
local_secrets.field_max_chars: 512
local_secrets.suggestions_max: 8

# Filling a saved login into the page the person is looking at: how long the cross-site confirmation stays open, and how old
# the probe of the page may be when the text is inserted (a fill that outlives this is refused and made again).
local_secrets.confirm_ttl_ms: 60000
local_secrets.fill_max_age_ms: 15000

# Importing from the person's other browsers (13.9 B): the switch, the most cookies and logins one import carries, the largest
# profile database it reads, and how long the approval it needs stays valid.
local_secrets.import_enabled: true
local_secrets.import_max_cookies: 20000
local_secrets.import_max_logins: 5000
local_secrets.import_max_db_bytes: 268435456
local_secrets.import_approval_ttl_ms: 300000

# One-time payment inputs the person supplies out of band (13.9 C): how long a supplied value waits to be used, the most fields
# in one request, and the longest value.
local_secrets.payment_ttl_ms: 300000
local_secrets.payment_max_fields: 12
local_secrets.payment_value_max_chars: 128
